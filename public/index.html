        socket.on('connect', () => {
            if (lastSelectedCountry) {
                socket.emit('reconnectSync', { country: lastSelectedCountry });
            }
        });

        // Initialize the map
        const map = L.map('map').setView([20, 0], 2);

        // set english map names and attribution
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/" target="_blank">CARTO</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>'
        }).addTo(map);

        // Initialize an empty object to store the countries and their shading status
        let countriesState = {};

        // Load country boundaries (replace with actual GeoJSON file)
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then((response) => response.json())
            .then((geojson) => {
                const geoLayer = L.geoJSON(geojson, {
                    onEachFeature: (feature, layer) => {
                        const countryId = feature.id;

                        // Default opacity is 0
                        let opacity = countriesState[countryId] || 0;

                        // Set the initial style for the country
                        layer.setStyle({
                            fillColor: SHADE_COLOR, // fill color
                            fillOpacity: opacity / 100, // Set opacity between 0 and 1
                            weight: 2, // Set border weight
                            color: '#000', // Border color
                            dashArray: '3', // Dashed border style
                        });

                        //const countryIds = geojson.features.map(feature => feature.id);
                        //console.log("List of Countries on the Map:", countryIds);

                        // Add interactivity: only allow interaction if opacity < 100
                        layer.on('click', () => {
                            // Check if the current layer is the same as the last selected country
                            if (lastSelectedCountry === countryId) {
                                return; // Don't allow re-shading the same country
                            }

                            // If the user selects another country, unshade the previously selected one
                            if (lastSelectedCountry) {
                                geoLayer.eachLayer((prevLayer) => {
                                    if (prevLayer.feature.id === lastSelectedCountry) {
                                        prevLayer.setStyle({
                                            fillOpacity: 1 / MAX_CLICKS, // Unshade the previous country
                                        });
                                    }
                                });
                            }

                            // Emit the current country selection
                            socket.emit('shadeCountry', { country: countryId });

                            // Store the selected country in localStorage
                            localStorage.setItem('lastSelectedCountry', countryId);
                            lastSelectedCountry = countryId;

                            // Update the current country's style
                            layer.setStyle({
                                fillOpacity: 1 / MAX_CLICKS, // Visually show as selected
                            });
                        });
                    },
                }).addTo(map);

                // Update country shading from the server
                socket.on('updateCountry', (data) => {
                    geoLayer.eachLayer((layer) => {
                        if (layer.feature.id === data.country) {
                            const opacity = data.opacity / 100; // Convert to 0-1
                            layer.setStyle({
                                fillColor: SHADE_COLOR,
                                fillOpacity: opacity,
                            });

                            // Disable interaction if fully shaded
                            if (data.opacity === 100) {
                                layer.options.interactive = false;
                            } else {
                                layer.options.interactive = true;
                            }
                        }
                    });
                });

                // Initialize the map with the current state
                socket.on('init', (states) => {
                    Object.keys(states).forEach((countryId) => {
                        geoLayer.eachLayer((layer) => {
                            if (layer.feature.id === countryId) {
                                const opacity = states[countryId] / 100;
                                layer.setStyle({
                                    fillColor: SHADE_COLOR,
                                    fillOpacity: opacity,
                                });

                                // Disable interaction if fully shaded
                                if (states[countryId] === 100) {
                                    layer.options.interactive = false;
                                }
                            }
                        });
                    });

                    // Highlight the user's previous selection
                    if (lastSelectedCountry) {
                        geoLayer.eachLayer((layer) => {
                            if (layer.feature.id === lastSelectedCountry) {
                                layer.options.interactive = false; // Disable interaction
                            }
                        });
                    }
                });
            });
