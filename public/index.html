<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const socket = io();
        let lastSelectedCountry = localStorage.getItem('lastSelectedCountry'); // Store the last selected country

        // Initialize the map
        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Initialize an empty object to store the countries and their shading status
        let countriesState = {};

        // Load country boundaries (replace with actual GeoJSON file)
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(response => response.json())
            .then(geojson => {
                const geoLayer = L.geoJSON(geojson, {
                    onEachFeature: (feature, layer) => {
                        const countryId = feature.id;
                        
                        // Default opacity is 0
                        let opacity = countriesState[countryId] || 0;

                        // Set the initial style for the country
                        layer.setStyle({
                            fillColor: '#FF0000', // Red fill color
                            fillOpacity: opacity / 100, // Set opacity between 0 and 1
                            weight: 2, // Set border weight
                            color: '#000', // Border color
                            dashArray: '3', // Dashed border style
                        });

                        // Add interactivity: only allow interaction if opacity < 100
                        if (opacity < 100) {
                            layer.on('click', () => {
                                // Emit the current country selection
                                if (lastSelectedCountry && lastSelectedCountry !== countryId) {
                                    socket.emit('unselectCountry', { country: lastSelectedCountry });
                                }

                                // Shade the new selected country
                                socket.emit('shadeCountry', { country: countryId });

                                // Store the selected country in localStorage
                                localStorage.setItem('lastSelectedCountry', countryId);

                                // Update last selected country in the session
                                lastSelectedCountry = countryId;
                            });
                        }

                        // Disable interaction if fully shaded
                        if (opacity === 100) {
                            layer.options.interactive = false;
                        } else {
                            layer.options.interactive = true;
                        }
                    }
                }).addTo(map);

                // Update country shading from the server
                socket.on('updateCountry', (data) => {
                    geoLayer.eachLayer((layer) => {
                        if (layer.feature.id === data.country) {
                            const opacity = data.opacity / 100; // Convert to 0-1
                            layer.setStyle({
                                fillColor: '#FF0000',
                                fillOpacity: opacity,
                            });

                            // Disable interaction if fully shaded
                            if (data.opacity === 100) {
                                layer.options.interactive = false;
                            } else {
                                layer.options.interactive = true;
                            }
                        }
                    });
                });

                // Initialize the map with the current state
                socket.on('init', (states) => {
                    Object.keys(states).forEach((countryId) => {
                        geoLayer.eachLayer((layer) => {
                            if (layer.feature.id === countryId) {
                                const opacity = states[countryId] / 100;
                                layer.setStyle({
                                    fillColor: '#FF0000',
                                    fillOpacity: opacity,
                                });

                                // Disable interaction if fully shaded
                                if (states[countryId] === 100) {
                                    layer.options.interactive = false;
                                }
                            }
                        });
                    });
                });
            });
    </script>
</body>
</html>
