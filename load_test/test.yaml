config:
  target: "http://34.30.7.98:3000" # Replace with your server URL
  phases:
    - duration: 30
      arrivalRate: 50 # Simulate 50 users per second
  engines:
    socketio: {}
scenarios:
  - engine: socketio
    flow:
      - emit:
          channel: "shadeCountry"
          data:
            country: "CYP"
      - emit:
          channel: "reconnectSync"
          data:
            country: "AFG"
      - think: 5
